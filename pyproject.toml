[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inkd"
version = "0.1.0"
description = "Two-way sync between a reMarkable tablet, Dropbox/Google Drive and Obsidian, without a reMarkable subscription"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "cairosvg>=2.7",
    "pypdf>=4",
    "pyyaml>=6",
    "rmc>=0.3",
    "rmscene>=0.7",
    "weasyprint>=62",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
inkd = "inkd.cli:main"

[tool.setuptools]
packages = ["inkd"]
